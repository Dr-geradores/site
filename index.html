<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#063a75" />
    <meta name="description" content="Gestão de orçamentos, eventos e geradores da DR Geradores" />
    <title>DR Geradores Gestão</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <button class="icon-button mobile-only" id="menuButton" aria-label="Abrir menu">☰</button>
        <img class="brand-logo" src="assets/logo-white.png" alt="DR Geradores" />
        <div class="topbar-copy desktop-only">
          <strong>Gestão operacional</strong>
          <span>Orçamentos, agenda e financeiro</span>
        </div>
        <button class="avatar-button" aria-label="Perfil da empresa">DR</button>
      </header>

      <aside class="side-nav" id="sideNav" aria-label="Navegação principal">
        <div class="side-brand">
          <img src="assets/logo-horizontal.png" alt="DR Geradores" />
          <span>Gestão</span>
        </div>
        <nav>
          <button data-route="home" class="nav-link active"><span>⌂</span> Início</button>
          <button data-route="calendar" class="nav-link"><span>▦</span> Agenda</button>
          <button data-route="quotes" class="nav-link"><span>▤</span> Orçamentos</button>
          <button data-route="finance" class="nav-link"><span>R$</span> Financeiro</button>
          <button data-route="clients" class="nav-link"><span>♙</span> Clientes</button>
          <button data-route="generators" class="nav-link"><span>⚡</span> Geradores</button>
          <button data-route="settings" class="nav-link"><span>⚙</span> Cadastros</button>
        </nav>
        <div class="storage-note">
          <strong>Versão inicial</strong>
          <span>Dados salvos neste aparelho</span>
        </div>
      </aside>

      <main id="mainContent" class="main-content" tabindex="-1"></main>
      <button class="fab" id="newQuoteFab" aria-label="Criar novo orçamento">＋</button>

      <nav class="bottom-nav" aria-label="Navegação móvel">
        <button data-route="home" class="bottom-link active"><span>⌂</span><small>Início</small></button>
        <button data-route="calendar" class="bottom-link"><span>▦</span><small>Agenda</small></button>
        <button data-action="new-quote" class="bottom-link bottom-create"><span>＋</span><small>Novo</small></button>
        <button data-route="quotes" class="bottom-link"><span>▤</span><small>Orçamentos</small></button>
        <button data-route="finance" class="bottom-link"><span>R$</span><small>Financeiro</small></button>
      </nav>
    </div>

    <div id="overlay" class="overlay hidden"></div>
    <section id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-label="Painel"></section>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
